name: Daily Commit

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update File
        run: |
          echo "Updated on $(date)" >> log.txt

      - name: Commit Changes
        run: |
          git config --global user.name "mananscasm"
          git config --global user.email "manan.street@gmail.com"

          git add .
          git commit -m "Daily automated commit" || echo "No changes"

          git push